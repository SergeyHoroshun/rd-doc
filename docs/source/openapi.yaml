openapi: 3.0.0
info:
  title: Lumache API
  description: |
    Lumache (/lu'make/) is a Python library for cooks and food lovers
    that creates recipes mixing random ingredients.
    It pulls data from the Open Food Facts database and offers a simple and intuitive API.
  version: 0.1.0
  contact:
    name: Graziella
    email: graziella@lumache
  license:
    name: MIT

servers:
  - url: https://api.lumache.example.com/v1
    description: Production server
  - url: https://staging-api.lumache.example.com/v1
    description: Staging server

paths:
  /ingredients:
    get:
      summary: Get random ingredients
      description: |
        Return a list of random ingredients as strings.
        The kind parameter can be used to filter ingredients by type.
      operationId: getRandomIngredients
      tags:
        - Ingredients
      parameters:
        - name: kind
          in: query
          description: |
            Optional kind of ingredients to return.
            Must be one of: "meat", "fish", or "veggies".
          required: false
          schema:
            type: string
            enum:
              - meat
              - fish
              - veggies
          example: veggies
      responses:
        '200':
          description: Successful response with list of ingredients
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingredients:
                    type: array
                    items:
                      type: string
                    description: List of random ingredient names
                    example:
                      - shells
                      - gorgonzola
                      - parsley
              examples:
                default:
                  value:
                    ingredients:
                      - shells
                      - gorgonzola
                      - parsley
                meat:
                  value:
                    ingredients:
                      - beef
                      - chicken
                      - pork
                fish:
                  value:
                    ingredients:
                      - salmon
                      - tuna
                      - cod
                veggies:
                  value:
                    ingredients:
                      - tomatoes
                      - lettuce
                      - carrots
        '400':
          description: Invalid kind parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidKindError
                message: The kind parameter must be one of "meat", "fish", or "veggies"

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type
        message:
          type: string
          description: Human-readable error message
      required:
        - error
        - message
